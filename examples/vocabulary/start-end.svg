<svg height="42" width="132" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="railroad" viewBox="0 0 132 42">
<style type="text/css">
svg.railroad {
background-color: hsl(30, 20%, 95%);
background-size: 15px 15px;
background-image: linear-gradient(to right, rgba(30, 30, 30, .05) 1px, transparent 1px),
		  linear-gradient(to bottom, rgba(30, 30, 30, .05) 1px, transparent 1px);
}

svg.railroad rect.railroad_canvas {
stroke-width: 0px;
fill: none;
}

svg.railroad path {
stroke-width: 3px;
stroke: black;
fill: none;
}

svg.railroad .continuation circle,
svg.railroad .continuation-start circle,
svg.railroad .continuation-end circle {
fill: black;
stroke: none;
}

svg.railroad .debug {
stroke-width: 1px;
stroke: red;
}

svg.railroad text {
font: 14px monospace;
text-anchor: middle;
}

svg.railroad .nonterminal text {
font-weight: bold;
}

svg.railroad text.comment {
font: italic 12px monospace;
}

svg.railroad rect,
svg.railroad .annotation > path.annotation-marker {
stroke-width: 3px;
stroke: black;
fill:hsl(-290, 70%, 90%);
}

svg.railroad g.labeledbox > rect,
svg.railroad .annotation > path.annotation-connector {
stroke-width: 1px;
stroke: grey;
stroke-dasharray: 5px;
fill: rgb(90, 90, 150);
fill-opacity: .1;
}

svg.railroad .annotation > path.annotation-connector {
fill: none;
}

/* Annotation markers use wavy arrows distinct from rail traversal arrows. */

svg.railroad .annotation > path.annotation-direction {
stroke-width: 2px;
stroke: black;
}
</style>
<title>
Vertical bars mark the beginning and end of a complete diagram.</title>
<rect width="100%" height="100%" class="railroad_canvas"/>
<g class="sequence">
<path d=" M 10 11 v 20 m 10 -20 v 20 m -10 -10 h 20"/>
<g class="nonterminal">
<rect x="40" y="10" height="22" width="52"/>
<text x="66" y="26">
expr</text>
</g>
<path d=" M 102 21 h 20 m -10 -10 v 20 m 10 -20 v 20"/>
<path d=" M 30 21 h 10"/>
<path d=" M 92 21 h 10"/>
</g>
</svg>

