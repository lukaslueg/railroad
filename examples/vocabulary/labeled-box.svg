<svg height="86" width="166" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="railroad" viewBox="0 0 166 86">
<style type="text/css">
svg.railroad {&#10;background-color: hsl(30, 20%, 95%);&#10;background-size: 15px 15px;&#10;background-image: linear-gradient(to right, rgba(30, 30, 30, .05) 1px, transparent 1px),&#10;		  linear-gradient(to bottom, rgba(30, 30, 30, .05) 1px, transparent 1px);&#10;}&#10;&#10;svg.railroad rect.railroad_canvas {&#10;stroke-width: 0px;&#10;fill: none;&#10;}&#10;&#10;svg.railroad path {&#10;stroke-width: 3px;&#10;stroke: black;&#10;fill: none;&#10;}&#10;&#10;svg.railroad .continuation circle,&#10;svg.railroad .continuation-start circle,&#10;svg.railroad .continuation-end circle {&#10;fill: black;&#10;stroke: none;&#10;}&#10;&#10;svg.railroad .debug {&#10;stroke-width: 1px;&#10;stroke: red;&#10;}&#10;&#10;svg.railroad text {&#10;font: 14px monospace;&#10;text-anchor: middle;&#10;}&#10;&#10;svg.railroad .nonterminal text {&#10;font-weight: bold;&#10;}&#10;&#10;svg.railroad text.comment {&#10;font: italic 12px monospace;&#10;}&#10;&#10;svg.railroad rect,&#10;svg.railroad .annotation &gt; path.annotation-marker {&#10;stroke-width: 3px;&#10;stroke: black;&#10;fill:hsl(-290, 70%, 90%);&#10;}&#10;&#10;svg.railroad g.labeledbox &gt; rect,&#10;svg.railroad .annotation &gt; path.annotation-connector {&#10;stroke-width: 1px;&#10;stroke: grey;&#10;stroke-dasharray: 5px;&#10;fill: rgb(90, 90, 150);&#10;fill-opacity: .1;&#10;}&#10;&#10;svg.railroad .annotation &gt; path.annotation-connector {&#10;fill: none;&#10;}&#10;&#10;/* Annotation markers use wavy arrows distinct from rail traversal arrows. */&#10;&#10;svg.railroad .annotation &gt; path.annotation-direction {&#10;stroke-width: 2px;&#10;stroke: black;&#10;}&#10;</style>
<title>
