<svg height="200" width="313" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="railroad" viewBox="0 0 313 200">
<style type="text/css">
svg.railroad {&#10;background-color: hsl(30, 20%, 95%);&#10;background-size: 15px 15px;&#10;background-image: linear-gradient(to right, rgba(30, 30, 30, .05) 1px, transparent 1px),&#10;		  linear-gradient(to bottom, rgba(30, 30, 30, .05) 1px, transparent 1px);&#10;}&#10;&#10;svg.railroad rect.railroad_canvas {&#10;stroke-width: 0px;&#10;fill: none;&#10;}&#10;&#10;svg.railroad path {&#10;stroke-width: 3px;&#10;stroke: black;&#10;fill: none;&#10;}&#10;&#10;svg.railroad .continuation circle,&#10;svg.railroad .continuation-start circle,&#10;svg.railroad .continuation-end circle {&#10;fill: black;&#10;stroke: none;&#10;}&#10;&#10;svg.railroad .debug {&#10;stroke-width: 1px;&#10;stroke: red;&#10;}&#10;&#10;svg.railroad text {&#10;font: 14px monospace;&#10;text-anchor: middle;&#10;}&#10;&#10;svg.railroad .nonterminal text {&#10;font-weight: bold;&#10;}&#10;&#10;svg.railroad text.comment {&#10;font: italic 12px monospace;&#10;}&#10;&#10;svg.railroad rect,&#10;svg.railroad .annotation &gt; path.annotation-marker {&#10;stroke-width: 3px;&#10;stroke: black;&#10;fill:hsl(-290, 70%, 90%);&#10;}&#10;&#10;svg.railroad g.labeledbox &gt; rect,&#10;svg.railroad .annotation &gt; path.annotation-connector {&#10;stroke-width: 1px;&#10;stroke: grey;&#10;stroke-dasharray: 5px;&#10;fill: rgb(90, 90, 150);&#10;fill-opacity: .1;&#10;}&#10;&#10;svg.railroad .annotation &gt; path.annotation-connector {&#10;fill: none;&#10;}&#10;&#10;/* Annotation markers use wavy arrows distinct from rail traversal arrows. */&#10;&#10;svg.railroad .annotation &gt; path.annotation-direction {&#10;stroke-width: 2px;&#10;stroke: black;&#10;}&#10;</style>
<title>
Consume one ASCII character if the upcoming input does not start with a quote, backslash, or CR. The assertion itself consumes no input.</title>
<rect width="100%" height="100%" class="railroad_canvas"/>
<g class="sequence">
<path d=" M 10 26 a 5 5 0 0 1 5 -5 a 5 5 0 0 1 5 5 a 5 5 0 0 1 -5 5 a 5 5 0 0 1 -5 -5 m 10 0 h 5"/>
<g class="sequence">
<g class="annotation">
<path d=" M 35 26 h 62 m -28 0 l -5 -5 m 0 10 l 5 -5 m 28 0 M 145 26 h 63 m -28 0 l -5 -5 m 0 10 l 5 -5 m 28 0" class="annotation-rail"/>
<path d=" M 121 10 l 24 16 l -24 16 l -24 -16 z" class="annotation-marker"/>
<path d=" M 121 42 l 0 16" class="annotation-connector"/>
<path d=" M 113 26 c 2 -4 5 -4 7 0 c 2 4 4 0 6 0 l 3 0 m -4 -4 l 4 4 l -4 4" class="annotation-direction"/>
<g class="labeledbox">
<rect x="35" y="58" height="132" width="173"/>
<path d=" M 35 105 h 8 m 132 0 h 33"/>
<text class="comment" x="121" y="81">
Must not match ahead</text>
<g class="sequence">
<g class="choice">
<path d=" M 43 105 h 24 m 28 0 h 32"/>
<g class="terminal">
<rect x="67" y="94" height="22" width="28" rx="10" ry="10"/>
<text x="81" y="110">
&quot;</text>
</g>
<path d=" M 43 105 a 12 12 0 0 1 12 12 v 9 m 60 0 v -9 a 12 12 0 0 1 12 -12"/>
<path d=" M 55 126 v 33 m 60 0 v -33"/>
<path d=" M 55 126 v 0 a 12 12 0 0 0 12 12 m 28 0 h 8 a 12 12 0 0 0 12 -12 v 0"/>
<g class="terminal">
<rect x="67" y="127" height="22" width="28" rx="10" ry="10"/>
<text x="81" y="143">
\</text>
</g>
<path d=" M 55 159 v 0 a 12 12 0 0 0 12 12 m 36 0 h 0 a 12 12 0 0 0 12 -12 v 0"/>
<g class="nonterminal">
<rect x="67" y="160" height="22" width="36"/>
<text x="85" y="176">
CR</text>
</g>
</g>
<g class="continuation">
<circle cx="148" cy="105" r="2.5" fill-opacity="0.5"/>
<circle cx="156" cy="105" r="2.5" fill-opacity="0.5"/>
<circle cx="164" cy="105" r="2.5" fill-opacity="0.5"/>
<path d=" M 137 105 h 6 M 169 105 h 6"/>
</g>
<path d=" M 127 105 h 10"/>
</g>
</g>
</g>
<g class="nonterminal">
<rect x="218" y="15" height="22" width="60"/>
<text x="248" y="31">
ASCII</text>
</g>
<path d=" M 208 26 h 10"/>
</g>
<path d=" M 288 26 h 5 a 5 5 0 0 1 5 -5 a 5 5 0 0 1 5 5 a 5 5 0 0 1 -5 5 a 5 5 0 0 1 -5 -5"/>
<path d=" M 25 26 h 10"/>
<path d=" M 278 26 h 10"/>
</g>
</svg>

