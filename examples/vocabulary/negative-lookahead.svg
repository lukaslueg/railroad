<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="railroad" viewBox="0 0 313 200" height="200" width="313">
<style type="text/css">
svg.railroad {
background-color: hsl(30, 20%, 95%);
background-size: 15px 15px;
background-image: linear-gradient(to right, rgba(30, 30, 30, .05) 1px, transparent 1px),
		  linear-gradient(to bottom, rgba(30, 30, 30, .05) 1px, transparent 1px);
}

svg.railroad rect.railroad_canvas {
stroke-width: 0px;
fill: none;
}

svg.railroad path {
stroke-width: 3px;
stroke: black;
fill: none;
}

svg.railroad .continuation circle,
svg.railroad .continuation-start circle,
svg.railroad .continuation-end circle {
fill: black;
stroke: none;
}

svg.railroad .debug {
stroke-width: 1px;
stroke: red;
}

svg.railroad text {
font: 14px monospace;
text-anchor: middle;
}

svg.railroad .nonterminal text {
font-weight: bold;
}

svg.railroad text.comment {
font: italic 12px monospace;
}

svg.railroad rect,
svg.railroad .annotation > path.annotation-marker {
stroke-width: 3px;
stroke: black;
fill:hsl(-290, 70%, 90%);
}

svg.railroad g.labeledbox > rect,
svg.railroad .annotation > path.annotation-connector {
stroke-width: 1px;
stroke: grey;
stroke-dasharray: 5px;
fill: rgb(90, 90, 150);
fill-opacity: .1;
}

svg.railroad .annotation > path.annotation-connector {
fill: none;
}

/* Annotation markers use wavy arrows distinct from rail traversal arrows. */

svg.railroad .annotation > path.annotation-direction {
stroke-width: 2px;
stroke: black;
}
</style>
<title>
Consume one ASCII character if the upcoming input does not start with a quote, backslash, or CR. The assertion itself consumes no input.</title>
<rect width="100%" height="100%" class="railroad_canvas"/>
<g class="sequence">
<path d=" M 10 26 a 5 5 0 0 1 5 -5 a 5 5 0 0 1 5 5 a 5 5 0 0 1 -5 5 a 5 5 0 0 1 -5 -5 m 10 0 h 5"/>
<g class="sequence">
<g class="annotation">
<path d=" M 35 26 h 62 m -28 0 l -5 -5 m 0 10 l 5 -5 m 28 0 M 145 26 h 63 m -28 0 l -5 -5 m 0 10 l 5 -5 m 28 0" class="annotation-rail"/>
<path d=" M 121 10 l 24 16 l -24 16 l -24 -16 z" class="annotation-marker"/>
<path d=" M 121 42 l 0 16" class="annotation-connector"/>
<path d=" M 113 26 c 2 -4 5 -4 7 0 c 2 4 4 0 6 0 l 3 0 m -4 -4 l 4 4 l -4 4" class="annotation-direction"/>
<g class="labeledbox">
<rect x="35" y="58" height="132" width="173"/>
<path d=" M 35 105 h 8 m 132 0 h 33"/>
<text class="comment" x="121" y="81">
Must not match ahead</text>
<g class="sequence">
<g class="choice">
<path d=" M 43 105 h 24 m 28 0 h 32"/>
<g class="terminal">
<rect x="67" y="94" height="22" width="28" rx="10" ry="10"/>
<text x="81" y="110">
&quot;</text>
</g>
<path d=" M 43 105 a 12 12 0 0 1 12 12 v 9 m 60 0 v -9 a 12 12 0 0 1 12 -12"/>
<path d=" M 55 126 v 33 m 60 0 v -33"/>
<path d=" M 55 126 v 0 a 12 12 0 0 0 12 12 m 28 0 h 8 a 12 12 0 0 0 12 -12 v 0"/>
<g class="terminal">
<rect x="67" y="127" height="22" width="28" rx="10" ry="10"/>
<text x="81" y="143">
\</text>
</g>
<path d=" M 55 159 v 0 a 12 12 0 0 0 12 12 m 36 0 h 0 a 12 12 0 0 0 12 -12 v 0"/>
<g class="nonterminal">
<rect x="67" y="160" height="22" width="36"/>
<text x="85" y="176">
CR</text>
</g>
</g>
<g class="continuation">
<circle cx="148" cy="105" r="2.5" fill-opacity="0.5"/>
<circle cx="156" cy="105" r="2.5" fill-opacity="0.5"/>
<circle cx="164" cy="105" r="2.5" fill-opacity="0.5"/>
<path d=" M 137 105 h 6 M 169 105 h 6"/>
</g>
<path d=" M 127 105 h 10"/>
</g>
</g>
</g>
<g class="nonterminal">
<rect x="218" y="15" height="22" width="60"/>
<text x="248" y="31">
ASCII</text>
</g>
<path d=" M 208 26 h 10"/>
</g>
<path d=" M 288 26 h 5 a 5 5 0 0 1 5 -5 a 5 5 0 0 1 5 5 a 5 5 0 0 1 -5 5 a 5 5 0 0 1 -5 -5"/>
<path d=" M 25 26 h 10"/>
<path d=" M 278 26 h 10"/>
</g>
</svg>

