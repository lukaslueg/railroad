<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="railroad" viewBox="0 0 476 134" height="134" width="476">
<style type="text/css">
svg.railroad rect.railroad_canvas {
fill: hsl(30, 20%, 95%);
stroke-width: 0px;
}

svg.railroad path {
stroke-width: 3px;
stroke: black;
fill: none;
}

svg.railroad .continuation circle,
svg.railroad .continuation-start circle,
svg.railroad .continuation-end circle {
fill: black;
stroke: none;
}

svg.railroad .debug {
stroke-width: 1px;
stroke: red;
}

svg.railroad text {
font: 14px monospace;
text-anchor: middle;
}

svg.railroad .nonterminal text {
font-weight: bold;
}

svg.railroad text.comment {
font: italic 12px monospace;
}

svg.railroad rect,
svg.railroad .annotation > path.annotation-marker {
stroke-width: 3px;
stroke: black;
fill:hsl(-290, 70%, 90%);
}

svg.railroad g.labeledbox > rect,
svg.railroad .annotation > path.annotation-connector {
stroke-width: 1px;
stroke: grey;
stroke-dasharray: 5px;
fill: rgb(90, 90, 150);
fill-opacity: .1;
}

svg.railroad .annotation > path.annotation-connector {
fill: none;
}

/* Annotation markers use wavy arrows distinct from rail traversal arrows. */

svg.railroad .annotation > path.annotation-direction {
stroke-width: 2px;
stroke: black;
}
</style>
<title>
Match a decimal integer, then reject exactly `0`. `START_OF_INPUT` denotes a zero-width input boundary, so `10` and `20` still pass the lookbehind. The assertion itself consumes no input.</title>
<rect width="100%" height="100%" class="railroad_canvas"/>
<g class="sequence">
<path d=" M 10 26 a 5 5 0 0 1 5 -5 a 5 5 0 0 1 5 5 a 5 5 0 0 1 -5 5 a 5 5 0 0 1 -5 -5 m 10 0 h 5"/>
<g class="sequence">
<g class="nonterminal">
<rect x="35" y="15" height="22" width="76"/>
<text x="73" y="31">
DECIMAL</text>
</g>
<g class="annotation">
<path d=" M 121 26 h 136 m -65 0 l -5 -5 m 0 10 l 5 -5 m 65 0 M 305 26 h 136 m -65 0 l -5 -5 m 0 10 l 5 -5 m 65 0" class="annotation-rail"/>
<path d=" M 281 10 l 24 16 l -24 16 l -24 -16 z" class="annotation-marker"/>
<path d=" M 281 42 l 0 16" class="annotation-connector"/>
<path d=" M 289 26 c -2 -4 -5 -4 -7 0 c -2 4 -4 0 -6 0 l -3 0 m 4 -4 l -4 4 l 4 4" class="annotation-direction"/>
<g class="labeledbox">
<rect x="121" y="58" height="66" width="320"/>
<path d=" M 121 105 h 8 m 170 0 h 142 m -68 0 l -5 -5 m 0 10 l 5 -5 m 68 0"/>
<text class="comment" x="281" y="81">
Must not match behind; consumes no input</text>
<g class="sequence">
<g class="nonterminal">
<rect x="129" y="94" height="22" width="132"/>
<text x="195" y="110">
START_OF_INPUT</text>
</g>
<g class="terminal">
<rect x="271" y="94" height="22" width="28" rx="10" ry="10"/>
<text x="285" y="110">
0</text>
</g>
<path d=" M 261 105 h 10"/>
</g>
</g>
</g>
<path d=" M 111 26 h 10"/>
</g>
<path d=" M 451 26 h 5 a 5 5 0 0 1 5 -5 a 5 5 0 0 1 5 5 a 5 5 0 0 1 -5 5 a 5 5 0 0 1 -5 -5"/>
<path d=" M 25 26 h 10"/>
<path d=" M 441 26 h 10"/>
</g>
</svg>

