<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="railroad" viewBox="0 0 336 134" height="134" width="336">
<style type="text/css">
svg.railroad {
background-color: hsl(30, 20%, 95%);
background-size: 15px 15px;
background-image: linear-gradient(to right, rgba(30, 30, 30, .05) 1px, transparent 1px),
		  linear-gradient(to bottom, rgba(30, 30, 30, .05) 1px, transparent 1px);
}

svg.railroad rect.railroad_canvas {
stroke-width: 0px;
fill: none;
}

svg.railroad path {
stroke-width: 3px;
stroke: black;
fill: none;
}

svg.railroad .continuation circle,
svg.railroad .continuation-start circle,
svg.railroad .continuation-end circle {
fill: black;
stroke: none;
}

svg.railroad .debug {
stroke-width: 1px;
stroke: red;
}

svg.railroad text {
font: 14px monospace;
text-anchor: middle;
}

svg.railroad .nonterminal text {
font-weight: bold;
}

svg.railroad text.comment {
font: italic 12px monospace;
}

svg.railroad rect,
svg.railroad .annotation > path.annotation-marker {
stroke-width: 3px;
stroke: black;
fill:hsl(-290, 70%, 90%);
}

svg.railroad g.labeledbox > rect,
svg.railroad .annotation > path.annotation-connector {
stroke-width: 1px;
stroke: grey;
stroke-dasharray: 5px;
fill: rgb(90, 90, 150);
fill-opacity: .1;
}

svg.railroad .annotation > path.annotation-connector {
fill: none;
}

/* Annotation markers use wavy arrows distinct from rail traversal arrows. */

svg.railroad .annotation > path.annotation-direction {
stroke-width: 2px;
stroke: black;
}
</style>
<title>
Match a decimal integer, then reject exactly `0`.</title>
<rect width="100%" height="100%" class="railroad_canvas"/>
<g class="sequence">
<path d=" M 10 26 a 5 5 0 0 1 5 -5 a 5 5 0 0 1 5 5 a 5 5 0 0 1 -5 5 a 5 5 0 0 1 -5 -5 m 10 0 h 5"/>
<g class="sequence">
<g class="nonterminal">
<rect x="35" y="15" height="22" width="76"/>
<text x="73" y="31">
DECIMAL</text>
</g>
<g class="annotation">
<path d=" M 121 26 h 66 m -30 0 l -5 -5 m 0 10 l 5 -5 m 30 0 M 235 26 h 66 m -30 0 l -5 -5 m 0 10 l 5 -5 m 30 0" class="annotation-rail"/>
<path d=" M 211 10 l 24 16 l -24 16 l -24 -16 z" class="annotation-marker"/>
<path d=" M 211 42 l 0 16" class="annotation-connector"/>
<path d=" M 219 26 c -2 -4 -5 -4 -7 0 c -2 4 -4 0 -6 0 l -3 0 m 4 -4 l -4 4 l 4 4" class="annotation-direction"/>
<g class="labeledbox">
<rect x="121" y="58" height="66" width="180"/>
<path d=" M 121 105 h 8 m 76 0 h 96 m -45 0 l -5 -5 m 0 10 l 5 -5 m 45 0"/>
<text class="comment" x="211" y="81">
Must not match behind</text>
<g class="sequence">
<g class="continuation">
<circle cx="140" cy="105" r="2.5" fill-opacity="0.5"/>
<circle cx="148" cy="105" r="2.5" fill-opacity="0.5"/>
<circle cx="156" cy="105" r="2.5" fill-opacity="0.5"/>
<path d=" M 129 105 h 6 M 161 105 h 6"/>
</g>
<g class="terminal">
<rect x="177" y="94" height="22" width="28" rx="10" ry="10"/>
<text x="191" y="110">
0</text>
</g>
<path d=" M 167 105 h 10"/>
</g>
</g>
</g>
<path d=" M 111 26 h 10"/>
</g>
<path d=" M 311 26 h 5 a 5 5 0 0 1 5 -5 a 5 5 0 0 1 5 5 a 5 5 0 0 1 -5 5 a 5 5 0 0 1 -5 -5"/>
<path d=" M 25 26 h 10"/>
<path d=" M 301 26 h 10"/>
</g>
</svg>

