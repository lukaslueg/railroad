<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="railroad" viewBox="0 0 232 42" height="42" width="232">
<style type="text/css">
svg.railroad rect.railroad_canvas {
fill: hsl(30, 20%, 95%);
stroke-width: 0px;
}

svg.railroad path {
stroke-width: 3px;
stroke: black;
fill: none;
}

svg.railroad .continuation circle,
svg.railroad .continuation-start circle,
svg.railroad .continuation-end circle {
fill: black;
stroke: none;
}

svg.railroad .debug {
stroke-width: 1px;
stroke: red;
}

svg.railroad text {
font: 14px monospace;
text-anchor: middle;
}

svg.railroad .nonterminal text {
font-weight: bold;
}

svg.railroad text.comment {
font: italic 12px monospace;
}

svg.railroad rect,
svg.railroad .annotation > path.annotation-marker {
stroke-width: 3px;
stroke: black;
fill:hsl(-290, 70%, 90%);
}

svg.railroad g.labeledbox > rect,
svg.railroad .annotation > path.annotation-connector {
stroke-width: 1px;
stroke: grey;
stroke-dasharray: 5px;
fill: rgb(90, 90, 150);
fill-opacity: .1;
}

svg.railroad .annotation > path.annotation-connector {
fill: none;
}

/* Annotation markers use wavy arrows distinct from rail traversal arrows. */

svg.railroad .annotation > path.annotation-direction {
stroke-width: 2px;
stroke: black;
}
</style>
<title>
An ellipsis joins the displayed parts of a diagram around a section that is not shown here.</title>
<rect width="100%" height="100%" class="railroad_canvas"/>
<g class="sequence">
<path d=" M 10 21 a 5 5 0 0 1 5 -5 a 5 5 0 0 1 5 5 a 5 5 0 0 1 -5 5 a 5 5 0 0 1 -5 -5 m 10 0 h 5"/>
<g class="sequence">
<g class="terminal">
<rect x="35" y="10" height="22" width="60" rx="10" ry="10"/>
<text x="65" y="26">
BEGIN</text>
</g>
<g class="continuation">
<circle cx="116" cy="21" r="2.5" fill-opacity="0.5"/>
<circle cx="124" cy="21" r="2.5" fill-opacity="0.5"/>
<circle cx="132" cy="21" r="2.5" fill-opacity="0.5"/>
<path d=" M 105 21 h 6 M 137 21 h 6"/>
</g>
<g class="terminal">
<rect x="153" y="10" height="22" width="44" rx="10" ry="10"/>
<text x="175" y="26">
END</text>
</g>
<path d=" M 95 21 h 10"/>
<path d=" M 143 21 h 10"/>
</g>
<path d=" M 207 21 h 5 a 5 5 0 0 1 5 -5 a 5 5 0 0 1 5 5 a 5 5 0 0 1 -5 5 a 5 5 0 0 1 -5 -5"/>
<path d=" M 25 21 h 10"/>
<path d=" M 197 21 h 10"/>
</g>
</svg>

