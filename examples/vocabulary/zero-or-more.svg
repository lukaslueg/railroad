<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="railroad" viewBox="0 0 204 82" height="82" width="204">
<style type="text/css">
svg.railroad rect.railroad_canvas {
fill: hsl(30, 20%, 95%);
stroke-width: 0px;
}

svg.railroad path {
stroke-width: 3px;
stroke: black;
fill: none;
}

svg.railroad .continuation circle,
svg.railroad .continuation-start circle,
svg.railroad .continuation-end circle {
fill: black;
stroke: none;
}

svg.railroad .debug {
stroke-width: 1px;
stroke: red;
}

svg.railroad text {
font: 14px monospace;
text-anchor: middle;
}

svg.railroad .nonterminal text {
font-weight: bold;
}

svg.railroad text.comment {
font: italic 12px monospace;
}

svg.railroad rect,
svg.railroad .annotation > path.annotation-marker {
stroke-width: 3px;
stroke: black;
fill:hsl(-290, 70%, 90%);
}

svg.railroad g.labeledbox > rect,
svg.railroad .annotation > path.annotation-connector {
stroke-width: 1px;
stroke: grey;
stroke-dasharray: 5px;
fill: rgb(90, 90, 150);
fill-opacity: .1;
}

svg.railroad .annotation > path.annotation-connector {
fill: none;
}

/* Annotation markers use wavy arrows distinct from rail traversal arrows. */

svg.railroad .annotation > path.annotation-direction {
stroke-width: 2px;
stroke: black;
}
</style>
<title>
Skip all items via the upper bypass, or consume one or more via the lower loop.</title>
<rect width="100%" height="100%" class="railroad_canvas"/>
<g class="sequence">
