<g class="terminal">
<rect x="59" y="28" height="22" width="52" rx="10" ry="10"/>
<text x="85" y="44">
else</text>
</g>
</g>
<path d=" M 145 39 h 5 a 5 5 0 0 1 5 -5 a 5 5 0 0 1 5 5 a 5 5 0 0 1 -5 5 a 5 5 0 0 1 -5 -5"/>
